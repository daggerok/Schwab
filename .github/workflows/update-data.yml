name: Update Schwab ETF data

on:
  # TEMPORARY bootstrap trigger (removed once api/schwab exists): the build
  # sandbox cannot reach schwabassetmanagement.com/Yahoo/SEC, and the branch
  # token cannot dispatch workflows, so the first feed is generated on push.
  push:
    branches: [arena/01a0b8a6-schwab]
    paths:
      - scripts/update-data.ts
      - .github/workflows/update-data.yml
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; continue after the saved ticker cursor; empty or 0 means a full pass over every catalog fund"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts; keep requests polite to Schwab, SEC and Yahoo (rendering-proxy requests are paced at 3.2s or slower)"
        required: false
        default: "2"
        type: string
      aum:
        description: "AUM min:max; bounds may be amounts or K/M/B/T suffixes, or nano/micro/small/mid/large"
        required: false
        default: ":"
        type: string
      ter:
        description: "Net expense ratio range in percent: min:max"
        required: false
        default: ":"
        type: string
      concurrency:
        description: "Parallel fund workers (keep low)"
        required: false
        default: "2"
        type: string
      holdings_page_size:
        description: "Rows in each generated holdings JSON page"
        required: false
        default: "250"
        type: string
      history_page_size:
        description: "Rows in each generated history JSON page"
        required: false
        default: "1000"
        type: string
      store_raw_downloads:
        description: "Store the official product finder and product pages under api/schwab/raw"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request"
        required: false
        default: "2"
        type: string
      tickers:
        description: "Only update these tickers, separated by spaces or commas"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Distribution Yield (TTM) percentage range; colon required"
        required: false
        default: ":"
        type: string
      history_range:
        description: "Yahoo chart range for history rows (max, 10y, 5y, ...)"
        required: false
        default: "max"
        type: string
      edgar_fallback:
        description: "Use SEC EDGAR Form N-PORT-P when the issuer holdings CSV is unavailable (default on)"
        required: false
        default: "1"
        type: string
      skip_yahoo:
        description: "Keep previous history and distributions while refreshing catalog/holdings"
        required: false
        default: ""
        type: string
      skip_schwab:
        description: "Keep the previously published catalog, product-page data, holdings and distributions"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "YTD total return range: min:max (official NAV return where published)"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "1Y total return range"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "Annualized 3Y return range"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "Annualized 5Y return range"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "Annualized 10Y return range"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "Cumulative YTD return range"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "Cumulative 1Y return range"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "Cumulative 3Y return range"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "Cumulative 5Y return range"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "Cumulative 10Y return range"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: update-schwab-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      MAX_FETCHES: ${{ inputs.max_fetches || '0' }}
      REQUEST_SLEEP: ${{ inputs.request_sleep || '2' }}
      AUM: ${{ inputs.aum || ':' }}
      TER: ${{ inputs.ter || ':' }}
      CONCURRENCY: ${{ inputs.concurrency || '2' }}
      HOLDINGS_PAGE_SIZE: ${{ inputs.holdings_page_size || '250' }}
      HISTORY_PAGE_SIZE: ${{ inputs.history_page_size || '1000' }}
      STORE_RAW_DOWNLOADS: ${{ inputs.store_raw_downloads || '' }}
      MAX_RETRIES: ${{ inputs.max_retries || '2' }}
      TICKERS: ${{ inputs.tickers || '' }}
      DIVIDEND_YIELD: ${{ inputs.dividend_yield || ':' }}
      HISTORY_RANGE: ${{ inputs.history_range || 'max' }}
      EDGAR_FALLBACK: ${{ inputs.edgar_fallback || '1' }}
      SKIP_YAHOO: ${{ inputs.skip_yahoo || '' }}
      SKIP_SCHWAB: ${{ inputs.skip_schwab || '' }}
      PERFORMANCE_YTD: ${{ inputs.performance_ytd || '' }}
      PERFORMANCE_1Y: ${{ inputs.performance_1y || '' }}
      PERFORMANCE_3Y: ${{ inputs.performance_3y || '' }}
      PERFORMANCE_5Y: ${{ inputs.performance_5y || '' }}
      PERFORMANCE_10Y: ${{ inputs.performance_10y || '' }}
      TOTAL_RETURN_YTD: ${{ inputs.total_return_ytd || '' }}
      TOTAL_RETURN_1Y: ${{ inputs.total_return_1y || '' }}
      TOTAL_RETURN_3Y: ${{ inputs.total_return_3y || '' }}
      TOTAL_RETURN_5Y: ${{ inputs.total_return_5y || '' }}
      TOTAL_RETURN_10Y: ${{ inputs.total_return_10y || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pinned dev tooling
        run: bun install --frozen-lockfile

      - name: Validate browser script
        run: bun ./scripts/check-index.ts

      - name: Run updater unit tests
        run: bun test scripts/update-data.test.ts

      - name: Type-check updater and tests
        run: bunx tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --types bun,node --skipLibCheck scripts/update-data.ts scripts/update-data.test.ts

      - name: Generate api/schwab static data
        run: bun ./scripts/update-data.ts

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- api/schwab)" ]; then
            echo "api/schwab is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/schwab
          git commit -m "Update Schwab ETF data"
          git push
